# Go 高性能高可靠编码规范

## 一、防御性编程（零 panic 原则）

### 1.1 切片/数组访问前必须检查长度
```go
// 错误
val := results[0]

// 正确
if len(results) == 0 {
    return nil, nil
}
val := results[0]
```

### 1.2 类型断言必须用 comma-ok 模式
```go
// 错误（panic 风险）
col := result.Fields.GetColumn("id").(*entity.ColumnInt64)

// 正确
raw := result.Fields.GetColumn("id")
if raw == nil {
    continue
}
col, ok := raw.(*entity.ColumnInt64)
if !ok {
    continue
}
```

### 1.3 map 访问用 comma-ok
```go
// 可接受（零值安全的场景）
val := m[key]

// 需要区分"不存在"和"零值"时必须用
val, ok := m[key]
if !ok {
    // handle missing
}
```

### 1.4 interface 参数必须检查 nil
```go
func Process(provider Provider) error {
    if provider == nil {
        return nil // 或返回错误，不要 panic
    }
    // ...
}
```

### 1.5 外部输入永远不可信
- HTTP 请求参数：Handler 层校验
- LLM 返回值：Engine 层校验
- Tool 参数：Tool 层标准化
- 数据库返回：检查空结果

## 二、错误处理

### 2.1 不忽略错误
```go
// 错误
json.Unmarshal(data, &obj)
db.Save(&record)

// 正确
if err := json.Unmarshal(data, &obj); err != nil {
    return fmt.Errorf("unmarshal failed: %w", err)
}
```

### 2.2 错误包装要有上下文
```go
// 错误
return err

// 正确
return fmt.Errorf("create bill for user %d: %w", userID, err)
```

### 2.3 不在 goroutine 中裸 panic
```go
// 错误
go func() {
    riskyOperation() // panic 会崩溃整个进程
}()

// 正确
go func() {
    defer func() {
        if r := recover(); r != nil {
            log.Printf("goroutine panic: %v", r)
        }
    }()
    riskyOperation()
}()
```

### 2.4 错误日志要可追溯
```go
// 错误
log.Printf("failed")

// 正确
log.Printf("failed to save memory for user %d, memory_id %d: %v", userID, memID, err)
```

## 三、并发安全

### 3.1 共享状态必须加锁
```go
type Registry struct {
    mu     sync.RWMutex
    skills map[string]*Skill
}

func (r *Registry) Get(name string) *Skill {
    r.mu.RLock()
    defer r.mu.RUnlock()
    return r.skills[name]
}
```

### 3.2 返回共享数据的拷贝，不返回引用
```go
// 错误（调用方可以修改内部状态）
func (r *Registry) GetAll() []*Skill {
    return r.skills
}

// 正确
func (r *Registry) GetAll() []Skill {
    result := make([]Skill, 0, len(r.skills))
    for _, s := range r.skills {
        result = append(result, *s)
    }
    return result
}
```

### 3.3 goroutine 必须有退出机制
```go
// 错误（goroutine 泄漏）
go func() {
    for {
        doWork()
        time.Sleep(time.Second)
    }
}()

// 正确
go func() {
    ticker := time.NewTicker(time.Second)
    defer ticker.Stop()
    for {
        select {
        case <-ticker.C:
            doWork()
        case <-ctx.Done():
            return
        }
    }
}()
```

### 3.4 context 必须传递和尊重
```go
// 错误
func DoWork() {
    db.Query("SELECT ...")
}

// 正确
func DoWork(ctx context.Context) error {
    return db.WithContext(ctx).Query("SELECT ...").Error
}
```

## 四、资源管理

### 4.1 打开的资源必须关闭
```go
resp, err := http.Get(url)
if err != nil {
    return err
}
defer resp.Body.Close()
```

### 4.2 数据库连接池配置
```go
sqlDB.SetMaxIdleConns(10)
sqlDB.SetMaxOpenConns(100)
sqlDB.SetConnMaxLifetime(time.Hour)
```

### 4.3 HTTP Client 复用
```go
// 错误（每次创建新 client）
resp, err := http.Post(url, "application/json", body)

// 正确（复用 client）
var client = &http.Client{Timeout: 30 * time.Second}
resp, err := client.Post(url, "application/json", body)
```

### 4.4 超时必须设置
```go
// HTTP 请求
ctx, cancel := context.WithTimeout(ctx, 30*time.Second)
defer cancel()

// Redis 操作
rdb.Set(ctx, key, value, 5*time.Minute)

// goroutine
ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
defer cancel()
```

## 五、性能优化

### 5.1 预分配切片容量
```go
// 错误
var result []string
for _, item := range items {
    result = append(result, item.Name)
}

// 正确
result := make([]string, 0, len(items))
for _, item := range items {
    result = append(result, item.Name)
}
```

### 5.2 字符串拼接用 strings.Builder
```go
// 错误（大量拼接时）
s := ""
for _, item := range items {
    s += item.Name + ","
}

// 正确
var sb strings.Builder
for _, item := range items {
    sb.WriteString(item.Name)
    sb.WriteByte(',')
}
```

### 5.3 避免在热路径上分配内存
```go
// 错误（每次调用都编译正则）
func Clean(s string) string {
    re := regexp.MustCompile(`<think>.*?</think>`)
    return re.ReplaceAllString(s, "")
}

// 正确（编译一次复用）
var thinkRegex = regexp.MustCompile(`(?s)<think>.*?</think>`)
func Clean(s string) string {
    return thinkRegex.ReplaceAllString(s, "")
}
```

### 5.4 数据库查询优化
```go
// 错误（N+1 查询）
for _, bill := range bills {
    asset := db.First(&Asset{}, bill.AssetID)
}

// 正确（批量查询）
assetIDs := extractAssetIDs(bills)
var assets []Asset
db.Where("id IN ?", assetIDs).Find(&assets)
```

### 5.5 JSON 序列化复用
```go
// 对于高频序列化的结构体，考虑使用 json.Encoder 而非 json.Marshal
// 或使用 sonic/jsoniter 等高性能 JSON 库
```

## 六、安全编码

### 6.1 SQL 注入防护
```go
// 错误
db.Where("category = " + category)

// 正确
db.Where("category = ?", category)
```

### 6.2 排序字段白名单
```go
allowedFields := map[string]bool{"date": true, "amount": true, "created_at": true}
if !allowedFields[orderField] {
    orderField = "created_at"
}
```

### 6.3 敏感信息不入日志
```go
// 错误
log.Printf("login with password: %s", password)

// 正确
log.Printf("login attempt for user: %s", username)
```

### 6.4 错误信息不泄露内部细节
```go
// 错误（泄露 DB 结构）
c.JSON(500, gin.H{"error": err.Error()})

// 正确
log.Printf("internal error: %v", err)
c.JSON(500, gin.H{"error": "internal server error"})
```

## 七、代码组织

### 7.1 单文件不超过 500 行
超过则按职责拆分。

### 7.2 函数不超过 50 行
超过则提取子函数。

### 7.3 参数不超过 5 个
超过则用结构体。

### 7.4 嵌套不超过 3 层
```go
// 错误
if a {
    if b {
        if c {
            // ...
        }
    }
}

// 正确（提前返回）
if !a {
    return
}
if !b {
    return
}
if !c {
    return
}
// ...
```

## 八、检查清单（每次提交前）

- [ ] 所有切片访问前检查了长度
- [ ] 所有类型断言用了 comma-ok
- [ ] 所有 error 都被处理（不忽略）
- [ ] 所有 goroutine 有 recover + 退出机制
- [ ] 所有外部调用有超时
- [ ] 所有共享状态有锁保护
- [ ] 返回的切片/map 是拷贝不是引用
- [ ] 无 SQL 拼接
- [ ] 错误信息不泄露内部细节
- [ ] 日志包含足够的上下文信息
