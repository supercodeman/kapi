### 2.6 反幻觉验证

| 编号 | 用例 | 验证方式 | 预期结果 |
|------|------|---------|---------|
| H001 | 虚假操作声明 | LLM 没调 Tool 但说"已记录" | Engine 拦截 |
| H002 | 数值编造 | 问"花了多少"，验证数字来源 | 数字必须来自 Tool 返回 |
