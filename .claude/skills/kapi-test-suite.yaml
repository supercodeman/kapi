# 咔皮记账测试套件 Skill

## 一、测试分层

```
第一层：单元测试（代码层）— go test
第二层：接口测试（API 层）— curl/脚本
第三层：场景测试（业务层）— 模拟用户操作序列
第四层：压力测试（性能层）— 并发请求
```

## 二、业务测试用例分类

### 2.1 记账核心（create_bill）

| 编号 | 用例 | 输入 | 预期结果 |
|------|------|------|---------|
| B001 | 基础支出记账 | "午饭30元" | bill_type=expense, category=食饮, sub_category=三餐, amount=30, date=今天 |
| B002 | 带商户记账 | "星巴克咖啡38元" | merchant=星巴克, category=食饮, sub_category=饮品 |
| B003 | 带日期记账 | "昨天打车25元" | date=昨天日期 |
| B004 | 收入记账 | "发工资15000" | bill_type=income, category=职业收入, sub_category=工资 |
| B005 | 大额支出 | "买了台电脑8000元" | category=购物, sub_category=数码 |
| B006 | 模糊分类 | "花了50块" | 应追问分类或默认"其他" |
| B007 | 超预算记账 | 预算已满时记账 | 记账成功 + 超支提醒 |
