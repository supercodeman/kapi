## 三、性能测试

### 3.1 响应时间基准

| 场景 | 目标 P95 | 测试方法 |
|------|---------|---------|
| 简单记账（单步） | ≤ 8s | 连续 20 次记账取 P95 |
| 查询统计 | ≤ 8s | 连续 20 次查询取 P95 |
| 多步推理（ReAct） | ≤ 15s | 复杂问题 10 次取 P95 |
| REST API（无 LLM） | ≤ 100ms | 100 次 CRUD 取 P95 |

### 3.2 并发测试

| 场景 | 并发数 | 持续时间 | 验证指标 |
|------|--------|---------|---------|
| CRUD API | 50 | 30s | 无 500 错误，P95 < 200ms |
| AI 对话 | 10 | 60s | 无 500 错误，数据不串 |
| 混合负载 | 30 CRUD + 5 AI | 60s | 系统稳定 |

### 3.3 压力测试脚本模板

```bash
#!/bin/bash
# 并发记账压力测试
BASE="http://localhost:8080"
TOKEN="$1"
CONCURRENT=10
TOTAL=50

for i in $(seq 1 $TOTAL); do
  (
    curl -s -X POST $BASE/api/chat \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $TOKEN" \
      -d "{\"message\":\"记一笔测试消费${i}元\",\"page_context\":\"记一笔\",\"session_id\":1}" \
      -o /dev/null -w "%{http_code} %{time_total}s\n"
  ) &
  if (( i % CONCURRENT == 0 )); then wait; fi
done
wait
```

## 四、测试执行规范

### 执行顺序
1. 先跑单元测试（go test）
2. 再跑接口测试（API 脚本）
3. 再跑场景测试（业务用例）
4. 最后跑压力测试

### 每次发版前必跑
- 全部 B 系列（记账核心）
- 全部 H 系列（反幻觉）
- 全部 T 系列（多租户）
- Q001 + P001 + A001（核心查询/预算/资产）

### 测试数据管理
- 每次测试前创建新用户，不复用旧数据
- 测试后不清理数据（保留用于排查）
- 压力测试用独立用户前缀（如 stress_user_001）
