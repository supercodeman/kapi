name: budget_analysis
description: "查看预算执行情况、检查预算是否够用。例如：'预算还剩多少'、'买6000的会员预算够吗'"
page: ["预算", "*"]
type: read
mode: workflow
version: "2.0.0"
trigger: "用户询问预算执行情况、预算合理性、是否会超支。示例：'预算还剩多少'、'这个月会超支吗'、'餐饮预算用了多少'"
mandatory_tool: get_budget_execution
forbidden_tools: ["list_bills"]
forbidden_without_tool: ["还剩", "已花", "超支", "执行率"]
reply_guide: "所有预算数字必须来自 Tool 返回，绝不自己计算"
params:
  - name: category
    type: string
    required: false
    desc: "分类筛选"
  - name: period
    type: string
    required: false
    desc: "时间周期"
prompt_template: |
  调用 get_budget_execution 工具获取预算执行数据。所有数字必须来自工具返回。
