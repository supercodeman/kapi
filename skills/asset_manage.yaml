name: asset_manage
description: "添加、修改或删除资产账户。例如：'添加一张信用卡'、'更新储蓄卡余额'"
page: ["资产管理", "*"]
type: write
mode: workflow
version: "2.0.0"
trigger: "用户要求创建、修改或删除资产。示例：'添加一张银行卡'、'修改余额'、'删除这个资产'"
mandatory_tool: create_asset
forbidden_without_tool: ["已添加", "已创建", "已修改", "已删除"]
reply_guide: "基于 Tool 返回的 message 确认操作结果"
params:
  - name: asset_id
    type: integer
    required: false
    desc: "资产ID（修改/删除时必填）"
  - name: action
    type: string
    required: true
    desc: "操作类型：create/update/delete"
  - name: name
    type: string
    required: false
    desc: "资产名称"
  - name: type
    type: string
    required: false
    desc: "资产类型：cash/credit/investment/debt"
  - name: balance
    type: float
    required: false
    desc: "余额"
prompt_template: |
  根据用户意图调用 create_asset、update_asset 或 delete_asset 工具。必须等 Tool 返回成功后才能确认。
