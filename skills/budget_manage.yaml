name: budget_manage
description: "创建、调整或删除预算。例如：'设置餐饮预算500元'、'把教育预算调到1万'"
page: ["预算", "*"]
type: write
mode: workflow
version: "2.0.0"
trigger: "用户要求设置、修改或删除预算。示例：'设置预算'、'创建预算'、'餐饮预算改成2000'、'删除购物预算'"
mandatory_tool: create_budget
forbidden_without_tool: ["已设置", "已创建", "已修改", "已调整", "已删除"]
reply_guide: "基于 Tool 返回的 message 确认操作结果，金额必须与 Tool 返回一致"
params:
  - name: category
    type: string
    required: true
    desc: "预算分类"
  - name: amount
    type: float
    required: true
    desc: "预算金额"
  - name: period
    type: string
    required: false
    desc: "周期：monthly/weekly，默认monthly"
    default: monthly
prompt_template: |
  根据用户意图调用 create_budget 或 update_budget 或 delete_budget 工具。必须等 Tool 返回成功后才能确认。
